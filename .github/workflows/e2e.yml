name: E2E

# Browser tests: the built web app in Chromium, against the API with a seeded database and a fake
# model. They never call SMARD or Gemini. See apps/e2e/README.md.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stromblick
          POSTGRES_PASSWORD: stromblick
          POSTGRES_DB: stromblick_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromblick -d stromblick_e2e"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      HUSKY: 0
      E2E_DATABASE_URL: postgresql://stromblick:stromblick@localhost:5432/stromblick_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API needs the Prisma client, and the database needs its tables.
      - run: pnpm --filter @stromblick/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - run: pnpm --filter @stromblick/web build
      - run: pnpm --filter @stromblick/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @stromblick/e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
