name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres for the database tests. Same version as local Docker and Neon.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stromblick
          POSTGRES_PASSWORD: stromblick
          POSTGRES_DB: stromblick_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stromblick -d stromblick_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      HUSKY: 0
      TEST_DATABASE_URL: postgresql://stromblick:stromblick@localhost:5432/stromblick_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @stromblick/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test
      - run: pnpm build
