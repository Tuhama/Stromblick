services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stromblick
      POSTGRES_PASSWORD: stromblick
      POSTGRES_DB: stromblick
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stromblick -d stromblick"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
